name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Scan the checkout before dependencies are installed; this scans the current
      # tree, not all Git history. Update and pin the image digest before release.
      - name: Scan current files for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir /repo --redact --no-banner

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check configuration, lint, format and types
        run: pnpm check

      - name: Test Android diagnostic permission policy
        run: pnpm --filter @openfind/mobile permissions:test

      - name: Validate migrations and database constraints
        run: |
          pnpm --filter @openfind/web db:check
          pnpm --filter @openfind/web db:test
          pnpm --filter @openfind/web auth:test
          pnpm --filter @openfind/web auth:spike
          pnpm --filter @openfind/web auth:attempts-test
          pnpm --filter @openfind/web auth:google-verifier-test
          pnpm --filter @openfind/web auth:attempt-verification-test
          pnpm --filter @openfind/web auth:account-issuance-test
          pnpm --filter @openfind/web auth:request-test
          pnpm --filter @openfind/web auth:mobile-start-test
          pnpm --filter @openfind/web auth:mobile-exchange-test
          pnpm --filter @openfind/web auth:mobile-flow-test
          pnpm --filter @openfind/web auth:mobile-rate-limit-test
          pnpm --filter @openfind/web auth:mobile-controller-test
          pnpm --filter @openfind/web auth:mobile-native-adapter-test
          pnpm --filter @openfind/web auth:mobile-integration-test
          pnpm --filter @openfind/web auth:mobile-backend-test
          pnpm --filter @openfind/web owner:test
          pnpm --filter @openfind/web owner:provisioning-test
          pnpm --filter @openfind/web owner:devices-test
          pnpm --filter @openfind/web owner:web-test

      - name: Build web app
        run: pnpm --filter @openfind/web build

      - name: Audit dependencies
        run: pnpm audit --audit-level high
