name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan current files for secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1
          dir /repo --redact --no-banner

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check configuration, lint, format and types
        run: pnpm check

      - name: Validate migrations and database constraints
        run: |
          pnpm --filter @openfind/web db:check
          pnpm --filter @openfind/web db:test
          pnpm --filter @openfind/web auth:test
          pnpm --filter @openfind/web auth:spike
          pnpm --filter @openfind/web auth:attempts-test

      - name: Build web app
        run: pnpm --filter @openfind/web build

      - name: Audit dependencies
        run: pnpm audit --audit-level high
